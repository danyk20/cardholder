# Overrides on top of detekt's default configuration (buildUponDefaultConfig = true).

complexity:
  CyclomaticComplexMethod:
    # One-to-one mappings (enum -> enum) are simple despite many branches.
    ignoreSimpleWhenEntries: true
  LongParameterList:
    # Composables idiomatically take many parameters (state + callbacks + modifier).
    functionThreshold: 10
    constructorThreshold: 10
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignorePrivate: true
    thresholdInFiles: 20
    thresholdInClasses: 15

naming:
  # Files commonly hold a composable plus its small state/callback holder classes.
  MatchingDeclarationName:
    active: false
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview']
    excludes: ['**/test/**', '**/androidTest/**', '**/testFixtures/**', '**/designsystem/**', '**/core/testing/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  MaxLineLength:
    maxLineLength: 120
  ReturnCount:
    max: 3
  ForbiddenComment:
    active: false
