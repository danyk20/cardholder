name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The checks run in parallel on separate runners; the last job reports under the name branch protection requires.
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Docs, store listings and screenshots can't break the build.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!fastlane/**'
              - '!**/*.md'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'

  workflow-lint:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Catches typos in expressions, unknown inputs and shell mistakes before they break a release.
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color

  static-analysis:
    name: Spotless & detekt
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # Neither needs compiled code, so this finishes first and gives the quickest feedback.
      - run: ./gradlew spotlessCheck detekt

  unit-tests:
    name: Unit tests & coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # Robolectric downloads its Android framework jar (~200 MB) into ~/.m2 at test time, outside Gradle's cache.
      # Keyed on Robolectric's version only, so unrelated dependency updates keep the cache.
      - name: Read Robolectric version
        id: robolectric
        run: echo "version=$(grep -m1 -E '^robolectric = "' gradle/libs.versions.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ steps.robolectric.outputs.version }}-${{ hashFiles('config/robolectric/**') }}
      # One invocation: Kover instruments the tests once instead of running them a second time for coverage.
      - run: ./gradlew testDebugUnitTest koverXmlReport
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/kover/
            **/build/test-results/
          retention-days: 14

  lint-and-build:
    name: Android Lint & debug APK
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # The app's lint checks all modules it depends on (checkDependencies); linting each module again would
      # analyse everything twice. core:testing isn't an app dependency, so it's linted on its own.
      - run: ./gradlew :app:lintDebug :core:testing:lint assembleDebug
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.*"
          retention-days: 14
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  result:
    # The status check that branch protection requires; it passes when every job passed or was skipped.
    name: Static analysis, tests & build
    if: always()
    needs: [changes, workflow-lint, static-analysis, unit-tests, lint-and-build]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if [ "$FAILED" = "true" ]; then exit 1; fi
