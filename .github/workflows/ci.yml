name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The checks run in parallel on separate runners; the last job reports under the name branch protection requires.
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Docs, store listings and screenshots can't break the build.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!fastlane/**'
              - '!**/*.md'
            # One pattern: with "every", a file would have to match all patterns of a filter.
            workflows:
              - '.github/{workflows,actions}/**'

  workflow-lint:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Catches typos in expressions, unknown inputs and shell mistakes before they break a release.
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color

  static-analysis:
    name: Spotless & detekt
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          configuration-cache-key: static-analysis
      # Neither needs compiled code, so this finishes first and gives the quickest feedback.
      - run: ./gradlew spotlessCheck detekt

  unit-tests:
    # Two halves on separate runners: the feature modules' Robolectric/Compose tests alone keep a runner busy.
    # The core half doesn't need the features or the app compiled, so it finishes well before.
    name: Unit tests (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [Core, Features]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          configuration-cache-key: unit-tests-${{ matrix.shard }}
      - uses: ./.github/actions/robolectric-cache
      # unitTestsCore / unitTestsFeatures (root build.gradle.kts): each module's tests on one variant, without
      # screenshot tests (they only do something when recording) or coverage (main only, see below).
      - run: ./gradlew unitTests${{ matrix.shard }}
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.shard }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14

  coverage:
    # Not part of the required check: pull requests don't wait for it. Main keeps a coverage report per commit.
    name: Coverage report
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          configuration-cache-key: coverage
      - uses: ./.github/actions/robolectric-cache
      # Runs every module's unit tests with Kover's agent, which only attaches when a Kover task is requested.
      - run: ./gradlew koverXmlReportUnit
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/reports/kover/
          retention-days: 30

  lint-and-build:
    name: Android Lint & debug APK
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          configuration-cache-key: lint-and-build
      # The app's lint checks all modules it depends on (checkDependencies); linting each module again would
      # analyse everything twice. core:testing isn't an app dependency, so it's linted on its own.
      # :app:lintDebug covers both distribution flavors (play, github); the CI APK is the GitHub one.
      - run: ./gradlew :app:lintDebug :core:testing:lint :app:assembleGithubDebug
      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.*"
          retention-days: 14
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/github/debug/*.apk
          retention-days: 14

  result:
    # The status check that branch protection requires; it passes when every job passed or was skipped.
    name: Static analysis, tests & build
    if: always()
    needs: [changes, workflow-lint, static-analysis, unit-tests, lint-and-build]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if [ "$FAILED" = "true" ]; then exit 1; fi
