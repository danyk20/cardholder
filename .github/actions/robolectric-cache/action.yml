name: Cache Robolectric
description: >-
  Robolectric downloads its Android framework jar (~200 MB) into ~/.m2 at test time, outside Gradle's cache.
  Keyed on Robolectric's version only, so unrelated dependency updates keep the cache.

runs:
  using: composite
  steps:
    - name: Read Robolectric version
      id: robolectric
      shell: bash
      run: echo "version=$(grep -m1 -E '^robolectric = "' gradle/libs.versions.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      with:
        path: ~/.m2/repository/org/robolectric
        key: robolectric-${{ steps.robolectric.outputs.version }}-${{ hashFiles('config/robolectric/**') }}
