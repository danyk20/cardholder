name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Never paste real card numbers, CVVs or ID numbers into issues.**"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Steps to reproduce, expected and actual behaviour.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device & Android version
      placeholder: Pixel 8, Android 16
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
